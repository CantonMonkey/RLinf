# One short real-R2R rollout/update is an engineering smoke, not evidence of
# learned navigation. The train and val_unseen selections are scene-disjoint.
defaults:
  - env/vln_r2r_env@env.train
  - env/vln_r2r_env@env.eval
  - model/vln_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    env,rollout,actor: 0

runner:
  task_type: embodied
  logger:
    log_path: /srv/navigation/runs/vln-r2r-v03
    project_name: rlinf-navigation-rl
    experiment_name: vln-r2r-ppo-smoke
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: false
  val_check_interval: 1
  save_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 1
  # A one-environment smoke can produce one valid transition (immediate STOP).
  # Sample-std normalization is undefined in that case; keep the raw GAE.
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  bootstrap_type: standard
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 1.0
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95

env:
  group_name: EnvGroup
  train:
    total_num_envs: 1
    dataset_split: train
    episode_index: 4852
  eval:
    total_num_envs: 1
    dataset_split: val_unseen
    episode_index: 630

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ""
    precision: ${actor.model.precision}
  enable_torch_compile: false
  enable_cuda_graph: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 8
  seed: 1234
  enable_offload: false
  model:
    model_type: vln_policy
    model_path: ""
    policy_setup: vln_r2r
    vocab_size: 2504
    max_instruction_tokens: 200
    image_size: 64
    action_dim: 1
    discrete_n_actions: 4
    num_action_chunks: 1
    precision: "32"
    add_value_head: true
    is_lora: false
    lora_rank: 32
  optim:
    lr: 1.0e-4
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 0.5
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
