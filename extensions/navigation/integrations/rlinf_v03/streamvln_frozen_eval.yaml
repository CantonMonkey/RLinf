# G2 is a bounded frozen-policy rollout/replay validation. It does not launch
# PPO and its diagnostic horizon is not a benchmark result. Use the dedicated
# eval_streamvln.py entrypoint; upstream train_embodied_agent.py requires a
# trainable actor checkpoint even in only-eval mode.
defaults:
  - env/streamvln_env@env.train
  - env/streamvln_env@env.eval
  - model/streamvln_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    env,rollout,actor: 0

runner:
  task_type: embodied_eval
  only_eval: true
  logger:
    log_path: ${oc.env:STREAMVLN_RUN_DIR,./runs/streamvln-frozen}
    project_name: rlinf-navigation-rl
    experiment_name: streamvln-frozen-g2
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  val_check_interval: 1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 1
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  bootstrap_type: standard
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  gamma: 0.99
  gae_lambda: 0.95

env:
  group_name: EnvGroup
  train:
    total_num_envs: 1
    dataset_split: train
    episode_index: 1189
  eval:
    total_num_envs: 1
    dataset_split: train
    episode_index: 1189

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model: ${actor.model}
  enable_torch_compile: false
  enable_cuda_graph: false
  return_logprobs: true
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 1
  seed: 1234
  enable_offload: false
  optim:
    lr: 0.0
    value_lr: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 0.0

reward:
  use_reward_model: false

critic:
  use_critic_model: false
