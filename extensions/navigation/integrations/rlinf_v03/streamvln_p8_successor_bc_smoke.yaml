# Single-slot, train-only policy-wiring smoke. The frozen release-manifest
# preflight rejects identity drift before weights, model factories, or Cluster.
defaults:
  - env/streamvln_env@env.train
  - model/streamvln_p8_successor_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

seed: 20260929

cluster:
  num_nodes: 1
  component_placement:
    env,rollout,actor: 0

runner:
  task_type: embodied
  worker_pair: p8_successor
  use_training_pipeline: false
  only_eval: false
  val_check_interval: -1
  max_epochs: 1
  max_steps: 4
  save_interval: 1
  resume_dir: null
  ckpt_path: null
  p8_successor_model_env_id: 0
  p8_successor_adapter_module: rlinf.workers.streamvln_p8_official_adapter
  p8_successor_env_controller_factory: rlinf.workers.streamvln_p8_successor_policy:build_successor_env_controller
  p8_successor_rollout_controller_factory: rlinf.workers.streamvln_p8_successor_policy:build_successor_rollout_controller
  p8_successor_actor_replay_adapter: rlinf.workers.streamvln_p8_successor_actor:build_successor_actor_replay_adapter
  p8_successor_official:
    source_root: ${oc.env:STREAMVLN_SOURCE}
    model_path: ${oc.env:STREAMVLN_BASE_MODEL}
    tokenizer_path: ${oc.env:STREAMVLN_TOKENIZER}
    vision_tower_path: ${oc.env:STREAMVLN_VISION_TOWER}
    artifact_manifest: ${oc.env:P8_RELEASE_ARTIFACT_MANIFEST}
  logger:
    log_path: ${oc.env:RLINF_P8_RUN_DIR,./runs/p8-successor-bc-smoke}
    project_name: rlinf-vln
    experiment_name: p8-successor-bc-smoke
    logger_backends: [tensorboard]

algorithm:
  update_epoch: 1
  normalize_advantages: false
  adv_type: p8_successor_duration_gae
  loss_type: p8_successor_joint_ppo
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  loss_agg_func: token-mean
  bootstrap_type: standard
  group_size: 1
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio_low: 0.2
  clip_ratio_high: 0.2
  value_clip: 0.2
  value_coef: 0.5
  waypoint_coef: 1.0
  successor_bc:
    enabled: true
    coef: 1.0
    expert_source: official_keep

env:
  group_name: EnvGroup
  train:
    env_type: streamvln
    executor_mode: p8_successor
    official_streamvln_frame: true
    total_num_envs: 1
    rollout_epoch: 1
    max_steps_per_rollout_epoch: 4
    max_episode_steps: 40
    dataset_split: train
    episode_index: 0

rollout:
  group_name: RolloutGroup
  backend: huggingface
  pipeline_stage_num: 1
  enable_offload: false
  enable_torch_compile: false
  enable_cuda_graph: false
  model:
    model_path: ""
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 1
  seed: 20260929
  enable_offload: false
  optim:
    lr: 1.0e-4
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 0.5
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
